name: CI

on:
  # Manual trigger from GitHub UI
  workflow_dispatch:

  # Scheduled trigger (every night at midnight UTC)
  schedule:
    - cron: "0 0 * * *"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1) Check out your repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Set up Java (adjust version if needed: 11, 17, etc.)
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      # 3) Run your Maven tests (this will run your Cucumber tests)
      - name: Run tests
        run: mvn -B test
